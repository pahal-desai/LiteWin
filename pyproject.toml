[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litewin"
version = "0.1.0"
description = "Linux-native Windows 11 customization builder. Windows, without the baggage."
authors = [{ name = "Pahal Desai" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
litewin = "litewin.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
